<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Our Kids</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="stage" aria-label="Kids photo slideshow">
    <div class="ambient" id="ambient"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="layer" id="layerA"></div>
    <div class="layer" id="layerB"></div>

    <div class="loader" id="loader" aria-hidden="true">
      <div class="spinner"></div>
    </div>

    <header class="top-bar">
      <div class="title">
        <span class="heart">❤︎</span>
        <span class="title-text">Our Kids</span>
      </div>
      <div class="controls top-controls">
        <button class="btn" id="btn-pause" title="Play / Pause (Space)" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" width="20" height="20"><path id="icon-pause" d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <button class="btn" id="btn-shuffle" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="btn" id="btn-fullscreen" title="Fullscreen (F)" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button class="btn" id="btn-download" title="Download this photo (D)" aria-label="Download current photo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="btn" id="btn-help" title="Keyboard shortcuts (?)" aria-label="Help">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </div>
    </header>

    <div class="caption" id="caption" aria-live="polite"></div>

    <div class="progress-ring" aria-hidden="true">
      <svg viewBox="0 0 36 36">
        <circle class="ring-bg" cx="18" cy="18" r="16"/>
        <circle class="ring-fg" id="ring-fg" cx="18" cy="18" r="16"/>
      </svg>
      <div class="counter" id="counter">1 / 1</div>
    </div>

    <button class="nav nav-prev" id="nav-prev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav nav-next" id="nav-next" aria-label="Next photo">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

    <div class="filmstrip-wrap">
      <div class="filmstrip" id="filmstrip" role="tablist" aria-label="All photos"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal" id="help-modal" aria-hidden="true">
      <div class="modal-card">
        <h2>Shortcuts</h2>
        <ul>
          <li><kbd>Space</kbd> Play / Pause</li>
          <li><kbd>←</kbd> <kbd>→</kbd> Previous / Next</li>
          <li><kbd>F</kbd> Fullscreen</li>
          <li><kbd>D</kbd> Download current</li>
          <li><kbd>S</kbd> Shuffle</li>
          <li><kbd>?</kbd> This help</li>
          <li><kbd>Esc</kbd> Close</li>
        </ul>
        <p class="hint">On mobile: swipe left / right, double-tap to fullscreen, long-press to pause.</p>
        <button class="btn primary" id="btn-close-help">Got it</button>
      </div>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
